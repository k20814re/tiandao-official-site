name: Update B2B products
on:
  push:
    paths:
      - "TianDao_B2B_Products.xlsx"
      - "tools/b2b_excel_to_json.py"
      - ".github/workflows/update-b2b-products.yml"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: update-b2b-products
  cancel-in-progress: true
jobs:
  update-b2b-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install converter
        run: pip install openpyxl==3.1.5
      - name: Convert B2B Excel to JSON
        run: python tools/b2b_excel_to_json.py
      - name: Commit generated B2B data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/b2b-products.json
          if git diff --cached --quiet; then
            echo "B2B data is already current."
          else
            git commit -m "自動更新 B2B 商品資料"
            git push
          fi
      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
